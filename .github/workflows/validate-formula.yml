name: Validate Formula

on:
  pull_request:
    paths:
      - 'Formula/**'
      - 'scripts/**'
      - '.github/workflows/validate-formula.yml'
  push:
    branches:
      - main
    paths:
      - 'Formula/**'
      - 'scripts/**'
      - '.github/workflows/validate-formula.yml'
  workflow_dispatch:

jobs:
  # Checks every platform's pin from one runner, without Homebrew. The brew job
  # below can only verify the pin for the platform it happens to be running on,
  # which leaves x86_64-apple-darwin and aarch64 Linux unchecked by it entirely.
  pins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap
        uses: actions/checkout@v4

      - name: Every sha256 is the hash of the artifact its url fetches
        run: scripts/verify-formula.sh

  # Runs the same script a contributor runs locally, rather than a second copy
  # of the same brew commands written in YAML. The two drifting apart is how the
  # local script ended up claiming "ready to push" for checks it never ran.
  brew:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout tap
        uses: actions/checkout@v4

      - name: Setup Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Pins, audit, style, strict audit, install, test
        run: scripts/validate-formula.sh --install
