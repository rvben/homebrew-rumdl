name: Validate Formula

# The markdown is in these filters because the brew job lints it. Without it a
# documentation-only change is exactly the change that skips the check meant to
# catch it. It does cost a full four-platform brew matrix for a typo fix, which is
# the price of keeping that lint next to the binary that performs it rather than
# installing rumdl a second time in a job of its own.
#
# Every workflow file, not just this one. The `pins` job below runs actionlint over
# `.github/workflows/`, and naming only this file left the other workflow - the one that
# rewrites the formula and pushes it - outside the filter, so a commit touching only
# update-formula.yml started no run and was never linted. Three of the eight commits that
# have ever touched that file changed nothing else, so the shape is the common one rather
# than the exception. The daily schedule ignores path filters and would have caught it
# eventually; a lint that runs a day after the merge is not the lint this repository
# thinks it has.
on:
  pull_request:
    paths:
      - 'Formula/**'
      - 'scripts/**'
      - '*.md'
      - '.github/workflows/**'
  push:
    branches:
      - main
    paths:
      - 'Formula/**'
      - 'scripts/**'
      - '*.md'
      - '.github/workflows/**'
  # The tap can break with no commit to this repository at all: a release
  # dispatch that never arrives leaves it a version behind, and GitHub release
  # assets can be replaced after publication, which makes an already-correct pin
  # wrong. v0.2.76 did exactly that - two successful Release runs on one tag
  # published two different macOS binaries - and for the window in between,
  # every `brew install` failed checksum verification with nothing watching.
  # A daily run is the only check that notices any of it.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

# Declared rather than inherited. Nothing here needs write access, and the repo
# default being read-only is a setting that can change without anyone revisiting
# this file.
permissions:
  contents: read

jobs:
  # Checks every platform's pin from one runner, without Homebrew. The brew job
  # below can only verify the pin for the platform it happens to be running on,
  # which leaves x86_64-apple-darwin and aarch64 Linux unchecked by it entirely.
  pins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap
        uses: actions/checkout@v6

      # Every check in this repository is a shell script, so a shell bug is a
      # guard bug. shellcheck ships on the runner image; the explicit existence
      # test is there because a `command not found` from a lint step reads as the
      # lint passing with nothing to say, which is how the suite's own missing
      # python3 once presented itself.
      - name: The scripts are free of shell defects
        env:
          # The version this job is expected to find, asserted rather than printed.
          # scripts/validate-formula.sh tells contributors that CI's shellcheck is
          # OLDER and stricter than a current local one, and names this version; a
          # runner-image bump would make that note false with nothing failing, and
          # the first symptom would be a lint that passes locally and fails here.
          # Bumping is a decision to take deliberately: re-read that note, re-run
          # the lint against the new version, then change this.
          SHELLCHECK_EXPECTED: 0.9.0
        run: |
          set -euo pipefail
          command -v shellcheck >/dev/null 2>&1 || {
            echo "::error::shellcheck is not on this runner image any more"
            exit 1
          }
          version="$(shellcheck --version | awk '/^version:/ { print $2 }')"
          echo "shellcheck $version"
          if [ "$version" != "$SHELLCHECK_EXPECTED" ]; then
            echo "::error::this runner has shellcheck $version, not the $SHELLCHECK_EXPECTED that scripts/validate-formula.sh documents to contributors. Re-read that note, re-run the lint against $version, and update both together."
            exit 1
          fi
          shellcheck scripts/*.sh

      # Invalid workflow YAML in this repository does not produce a failing run,
      # it produces no run - which is indistinguishable from a watchdog with
      # nothing to report. A malformed `freshness` job would retire the only check
      # that notices a replaced release asset, silently. actionlint is what makes
      # that a failure instead.
      #
      # Downloaded and hash-checked rather than installed from a package manager,
      # partly to pin the version and partly because verifying a downloaded
      # binary against a known sha256 is this repository's entire subject.
      - name: The workflows are valid
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          tar="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tar" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tar"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$tar" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tar" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" --version
          "$RUNNER_TEMP/actionlint" -color

      # Before trusting the check below, check the checker. Offline and hermetic,
      # so it costs seconds: it breaks the formula one way at a time and requires
      # the guard to reject each one with the message belonging to the check under
      # test. Every invariant here was added because a broken formula once passed
      # it, and without this those proofs were one-off experiments that a later
      # edit could quietly undo.
      - name: The guards reject what they are supposed to reject
        run: scripts/test-guards.sh

      - name: Every sha256 is the hash of the artifact its url fetches
        run: scripts/verify-formula.sh

  # Is the formula still pointing at rumdl's newest release? Nothing else asks.
  # The update is triggered by a dispatch from rumdl's release workflow, whose
  # notify step is `continue-on-error: true`, so a lost dispatch leaves this tap
  # silently behind with both repositories green.
  freshness:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout tap
        uses: actions/checkout@v6

      - name: The formula names rumdl's latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          formula="$(sed -n 's|.*/releases/download/v\([0-9][0-9.]*\)/.*|\1|p' Formula/rumdl.rb | sort -u)"
          latest="$(gh release view --repo rvben/rumdl --json tagName --jq '.tagName' | sed 's/^v//')"
          echo "formula: $formula"
          echo "latest released: $latest"
          if [ "$formula" != "$latest" ]; then
            echo "::error::the tap is pinned to $formula but rumdl's latest release is $latest"
            echo "Run the Update Formula workflow, or scripts/update-formula.sh $latest locally."
            exit 1
          fi
          echo "The tap is up to date."

  # Runs the same script a contributor runs locally, rather than a second copy
  # of the same brew commands written in YAML. The two drifting apart is how the
  # local script ended up claiming "ready to push" for checks it never ran.
  brew:
    strategy:
      fail-fast: false
      matrix:
        # All four platforms the formula declares, because a job can only ever
        # install and run the binary for the platform it is on. `macos-latest`
        # is arm64 and `ubuntu-latest` is x86_64, so those two alone left
        # x86_64-apple-darwin and aarch64 Linux never once executed - and an
        # unrunnable binary is exactly what a wrong-branch pin produces. All
        # four labels are free on public repositories, and ARM64 Linux is a
        # Tier 1 Homebrew platform.
        os: [macos-latest, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout tap
        uses: actions/checkout@v6

      # Pinned to a commit, not to a branch. `@master` was the reference here
      # until now, and Homebrew/actions has since renamed its default branch to
      # `main`, so that reference survived only on GitHub's rename redirect - in
      # a workflow that had never once executed to reveal it. A branch reference
      # also means this job runs whatever that branch holds on the day.
      - name: Setup Homebrew
        uses: Homebrew/actions/setup-homebrew@848c272c7bfe984a197bd4d16383f4c106ec61e6 # 2026.09.21.1

      - name: Pins, audit, style, strict audit, install, test
        run: scripts/validate-formula.sh --install
