name: Update Formula

on:
  repository_dispatch:
    types: [rumdl_release]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to update to (e.g. 0.2.76)'
        required: true
        type: string

permissions:
  contents: write
  # Needed to dispatch Validate Formula below. A push made with GITHUB_TOKEN
  # does not trigger workflows, so the validation has to be asked for.
  actions: write
  # The updater verifies each asset's build provenance, which reads rvben/rumdl's
  # attestations through the API.
  attestations: read

# Two releases dispatched close together would otherwise race on main.
concurrency:
  group: update-formula
  cancel-in-progress: false

jobs:
  update-formula:
    runs-on: ubuntu-latest
    # Capped for the reason the validation workflow's jobs are, and lower: this
    # job rewrites pins and pushes. An hour of it waiting on a fetch is an hour
    # the concurrency group above holds every queued release behind it.
    timeout-minutes: 15
    steps:
      # `main` rather than the event's commit. A second release dispatched
      # before the first one pushes waits in the concurrency queue above, and
      # would otherwise start from the commit that was current when it was
      # dispatched - its own push would then be rejected as non-fast-forward.
      # Checking out the branch means a queued run starts from what the run
      # ahead of it just pushed.
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Update formula and verify every pin
        env:
          # Via env, not ${{ }} inside the script: this value comes from a
          # dispatch payload and must not be able to become shell.
          VERSION_INPUT: ${{ github.event.client_payload.version || inputs.version }}
          # The script runs `gh attestation verify`, which needs a token: a
          # hosted runner has no gh login, and without this the updater aborts
          # with "please run gh auth login" - a failure that could only ever
          # appear after a real release, since nothing else runs this step.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Requested version: $VERSION_INPUT"
          # The script validates the format, hashes the assets its own url lines
          # name, and re-verifies every pin against the published artifacts.
          # It aborts rather than leaving any platform on a stale pin.
          scripts/update-formula.sh "$VERSION_INPUT"

      - name: Commit and push
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Formula already up to date; nothing to commit."
            exit 0
          fi
          # Read the version back out of the formula rather than trusting the
          # input, so the commit message can only ever name the version that was
          # actually written. It comes from the urls because the formula
          # declares no version of its own; the step above already proved all of
          # them agree.
          version="$(sed -n 's|.*/releases/download/v\([0-9][0-9.]*\)/.*|\1|p' Formula/rumdl.rb | sort -u)"
          if [ -z "$version" ] || [ "$(printf '%s\n' "$version" | wc -l)" != "1" ]; then
            echo "error: could not read a single version from Formula/rumdl.rb" >&2
            exit 1
          fi
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add Formula/rumdl.rb
          git commit -m "chore(formula): update rumdl to v${version}"
          git push origin HEAD:main

      - name: Ask for full Homebrew validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # brew audit/install/test on real macOS and Linux runners. This has to
          # be an explicit dispatch: the push above was made with GITHUB_TOKEN,
          # and GitHub does not start workflows from such pushes, which is why
          # Validate Formula never ran once between 2025-10-21 and 2026-09-23.
          gh workflow run validate-formula.yml --ref main
          echo "Dispatched Validate Formula."
